<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Source integrity benchmark</title>
  <output id="result">running</output>
  <script type="module">
    import { verifyWorkingSources } from "../src/editor/coverage.ts";

    const total = 32 * 1024 * 1024;
    const lengths = Array.from({ length: 6 }, (_, index) =>
      Math.floor(total / 6) + (index < total % 6 ? 1 : 0));
    const sources = [];
    for (const [index, length] of lengths.entries()) {
      const bytes = new Uint8Array(length);
      for (let offset = 0; offset < length; offset += 1) bytes[offset] = (offset * 13 + index * 29) & 255;
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const sha = Array.from(new Uint8Array(digest), (part) => part.toString(16).padStart(2, "0")).join("");
      sources.push({ entry: { result: { sourceId: `synthetic_${index}`, byteSha256: sha } }, originalBytes: bytes });
    }
    const started = performance.now();
    const proof = await verifyWorkingSources(sources);
    const proofMs = performance.now() - started;
    const samples = [];
    for (let index = 0; index < 9; index += 1) {
      const start = performance.now();
      if (!proof.matches(sources)) throw new Error("valid sources rejected");
      samples.push(performance.now() - start);
    }
    const copies = sources.map((source) => source.originalBytes.slice());
    function same32(leftBytes, rightBytes) {
      const left = new DataView(leftBytes.buffer, leftBytes.byteOffset, leftBytes.byteLength);
      const right = new DataView(rightBytes.buffer, rightBytes.byteOffset, rightBytes.byteLength);
      const whole = leftBytes.length - leftBytes.length % 4;
      for (let offset = 0; offset < whole; offset += 4) {
        if (left.getUint32(offset) !== right.getUint32(offset)) return false;
      }
      for (let offset = whole; offset < leftBytes.length; offset += 1) {
        if (leftBytes[offset] !== rightBytes[offset]) return false;
      }
      return true;
    }
    const candidate32SamplesMs = [];
    for (let index = 0; index < 9; index += 1) {
      const start = performance.now();
      if (!sources.every((source, offset) => same32(copies[offset], source.originalBytes)))
        throw new Error("32-bit comparison rejected valid sources");
      candidate32SamplesMs.push(performance.now() - start);
    }
    sources[5].originalBytes[sources[5].originalBytes.length - 1] ^= 1;
    const sameLengthMutationRejected = !proof.matches(sources);
    sources[5].originalBytes[sources[5].originalBytes.length - 1] ^= 1;
    sources[0].originalBytes = sources[0].originalBytes.slice();
    const copyAccepted = proof.matches(sources);
    const result = { bytes: total, sources: sources.length, valid: proof.valid, proofMs,
      samplesMs: samples, candidate32SamplesMs, sameLengthMutationRejected, copyAccepted };
    document.querySelector("#result").textContent = JSON.stringify(result);
  </script>
</html>
