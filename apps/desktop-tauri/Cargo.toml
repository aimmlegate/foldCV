[package]
name = "foldcv-desktop-tauri"
# The app version is the one in tauri.conf.json.
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "foldcv-beta"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# custom-protocol makes every build a release build that never looks for a dev server.
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
tauri-plugin-dialog = "=2.8.4"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit for the error alert (rfd gives parentless dialogs to the notification center) and the window buttons.
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSButton", "NSControl",
  "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }

[target.'cfg(windows)'.dependencies]
# A second start shows the running window.
tauri-plugin-single-instance = "=2.5.5"
# The error message box, links for the default browser and a helper without a console window.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
