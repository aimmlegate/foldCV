provenance:
  precedence: explicit_user_decisions_then_written_requirements_then_examples
  decisions:
  - 'A centered name and title, bold-italic section headings, «label: value» lines for the questionnaire data, and one bordered
    key-value table per project under its centered name: period, role, description, technologies, duties and personal results.'
  - The sample's vendor lines, age, e-mail, team and duration rows have no fact and are left out; the free-form questions
    at the end became the «О себе» summary.
  - 'Fonts stay Source Sans Pro Regular and Bold (D127): Google Docs knows these faces.'
  interpretations:
  - The sample set its tables wider than the text; here the table keeps the column width.
  - Geometry and spacing are a draft and still need renderer and Word validation.
