    fields: []
    instructions: []
  view:
    mode: object
    heading: none
    inset: 0
    item_gap: 0
    nodes:
    - type: text
      field: /name
      style: name
      header_slot: name
    - type: text
      field: /profession
      style: profession
      header_slot: profession
    title: {}
  mode: model
  depends_on: []
  operation: null
  when: null
