layout:
  regions:
  - id: header
    x: 21.26
    width: 450
    flow: first_page_header
  - id: sidebar
    x: 26.51
    width: 118.5
    flow: independent_column
  - id: main
    x: 150.26
    width: 444.75
    flow: independent_column
  reading_order: [header, sidebar, main]
  pagination:
    allow_project_split: true
    keep_heading_with_next: true
    allow_more_pages: true
    truncate_content: false
source:
  retain_original: true
  retain_unmapped_facts: true
content_definitions:
  role_family:
    type: [string, 'null']
    enum:
    - system_analyst
    - business_analyst
    - tester
    - designer
    - other
    - null
  text:
    type: [string, 'null']
    minLength: 1
  texts: [string]
  date:
    type: [object, 'null']
    additionalProperties: false
    required: [raw, year, month]
    properties:
      raw:
        type: string
        minLength: 1
      year:
        type: [integer, 'null']
        minimum: 1
        maximum: 9999
      month:
        type: [integer, 'null']
        minimum: 1
        maximum: 12
    if:
      type: object
      properties:
        month:
          type: integer
      required: [month]
    then:
      properties:
        year:
          type: integer
  period:
    raw: text
    start: date
    end: date
    ongoing?: boolean
  terms:
    items: texts
