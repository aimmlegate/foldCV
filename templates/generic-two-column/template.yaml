provenance:
  references:
  - id: reference_a
    role: visual
    pages: 3
    sha256: d73b75fcb18e08616b8597b6312298023cdead46a4c55db6bf0ce21dbfaa385f
  - id: reference_b
    role: visual
    pages: 3
    sha256: a5e91e5bc990ab86a33f58a5e2012330bd19d9021c55ca7ee979fb8c83eac606
  - id: requirements
    role: rules
    pages: 3
    sha256: fe4f875c9d1ca3ad6a480a986b79f754a201d67d1b26091200eca187d34c7202
  precedence: explicit_user_decisions_then_written_requirements_then_examples
  decisions:
  - Keep the Generic logo and corporate footer, as confirmed by the user.
  - Both examples use one template with optional content, not two independent schemas.
  interpretations:
  - Examples contain no evidence for fixed task, result, focus or character limits.
  - Section headings use Bold in reference_a and Black in reference_b; use one configurable Bold token consistently.
  - Ten-year compression uses the end date; ongoing, overlapping and uncertain periods remain detailed.
  - A comma-separated single line means one paragraph that may wrap; never shrink or truncate to force one physical
    line.
  - Month-only and year-only precision stays as stated; do not invent missing months, durations or metrics.
  - Geometry follows measured PDF anchors; flow spacing is a draft and still needs renderer and Word validation.
  - The generic recovery settings are implementation defaults, not requirements from the PDF.
