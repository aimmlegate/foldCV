- id: portfolio
  fields:
    name: text
    url: text
- id: summary
  fields:
    text: text
- id: projects
  fields:
    company: text
    role: text
    start: date
    end: date
    present?: boolean
  builtin: employment
  builtin_fields:
    company: employer
    role: role
    start: start @project-period
    end: end @project-period
    present: present @project-period
- id: project
  fields:
    name: text
