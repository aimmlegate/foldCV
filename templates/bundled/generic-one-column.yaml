provenance:
  precedence: explicit_user_decisions_then_written_requirements_then_examples
  decisions:
  - One column with no logo, no Focus block and no footer text; the former side column sections follow the main ones.
  - Section headings have no background; job technologies keep their light chips.
  - Type and spacing are a little more compact than the bundled two-column template.
  interpretations:
  - Plain headings take their block inset, so every block uses the column edge and headings line up with their text.
  - Geometry and spacing are a draft and still need renderer and Word validation.
