operations:
- id: project-window
  kind: partition_employment
  parameters:
    years: 15
    detailed: projects
    compact: other_projects
  inputs: [projects]
- id: role-branch
  kind: select_role_branch
  parameters:
    role_families: [system_analyst, business_analyst, tester, designer]
    matched: skills_and_tools
    otherwise: technical
    classification:
      semantic_type: foldcv:role_family
      field: family
  inputs: [identity]
- id: technical-skills
