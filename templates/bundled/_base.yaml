  SourceSansPro-Black: assets/SourceSansPro-Black.ttf
  SourceSansPro-LightIt: assets/SourceSansPro-LightIt.ttf
  SourceSansPro-It: assets/SourceSansPro-It.ttf
  SourceSansPro-SemiboldIt: assets/SourceSansPro-SemiboldIt.ttf
  SourceSansPro-BoldIt: assets/SourceSansPro-BoldIt.ttf
  SourceSansPro-BlackIt: assets/SourceSansPro-BlackIt.ttf
  source-sans-license: assets/SourceSansPro-LICENSE.txt
