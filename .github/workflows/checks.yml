name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: apps/web
      - run: .venv/bin/python tools/checks.py fast

  integration-render:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: bash tools/install-local-renderer.sh
      - run: .venv/bin/python tools/checks.py integration-render

  browser:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: .venv/bin/python tools/checks.py browser
