name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: apps/web
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider
        env:
          PYTHONPATH: services/api/src
      - run: npm run test:state
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run contracts:check
        working-directory: apps/web
      - run: .venv/bin/python tools/check_private_resume_data.py

  integration-render:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: bash tools/install-local-renderer.sh
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider -m slow
        env:
          PYTHONPATH: services/api/src
